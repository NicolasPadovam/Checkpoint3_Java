# Profile prd - conexao configurada exclusivamente por variaveis de ambiente
# (Docker, docker-compose e Azure App Service). Para o Azure SQL Database use
# DB_ENCRYPT=true e DB_TRUST_CERT=false (valores padrao).
spring.datasource.url=jdbc:sqlserver://${DB_SERVER_URL}:${DB_SERVER_PORT:1433};databaseName=${DB_SCHEMA};encrypt=${DB_ENCRYPT:true};trustServerCertificate=${DB_TRUST_CERT:false};loginTimeout=30
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PWD}
spring.jpa.show-sql=false
